<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=800, height=480, initial-scale=1.0">
  <title>reTerminal E1002 - Dashboard</title>
  <style>
    /* PALETA PRIMARIA E-INK SPECTRA 6 */
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
    body {
      width: 800px; height: 480px; overflow: hidden; background-color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      color: #000000; padding: 8px; display: flex; flex-direction: column; gap: 6px;
    }

    /* CABECERA (66px) */
    .header {
      height: 66px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #FFFFFF;
      border: 2px solid #000000;
      border-radius: 6px;
      padding: 0 12px;
      overflow: hidden;
    }

    /* BLOQUE 1: RELOJ Y FECHA */
    .header-time-box {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 220px;
    }
    .clock-badge {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 26px;
      font-weight: 800;
      color: #0044CC;
      letter-spacing: -0.5px;
    }
    .date-info {
      display: flex;
      flex-direction: column;
      border-left: 2px solid #000000;
      padding-left: 8px;
    }
    .date-day {
      font-size: 13px;
      font-weight: 800;
      text-transform: capitalize;
      line-height: 1.1;
    }
    .date-sub {
      font-size: 10px;
      font-weight: 700;
    }

    /* BLOQUE 2: PRONÓSTICO FIN DE SEMANA */
    .weekend-forecast-box {
      display: flex;
      flex-direction: column;
      border-left: 2px solid #000000;
      border-right: 2px solid #000000;
      padding: 0 12px;
      height: 48px;
      justify-content: center;
      min-width: 230px;
    }
    .weekend-title {
      font-size: 10px;
      font-weight: 800;
      color: #0044CC;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 2px;
    }
    .weekend-days {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 800;
    }
    .weekend-day-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* BLOQUE 3: CLIMA ACTUAL BUENOS AIRES */
    .weather-current-box {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 240px;
      justify-content: flex-end;
    }
    .weather-temp {
      font-size: 28px;
      font-weight: 800;
      color: #000000;
      line-height: 1;
    }
    .weather-meta {
      display: flex;
      flex-direction: column;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
      line-height: 1.25;
      text-align: left;
    }
    .weather-city {
      color: #0044CC;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    /* CONTENEDOR PRINCIPAL (392px) */
    .main-grid {
      height: 392px;
      display: grid;
      grid-template-columns: 440px 338px;
      gap: 6px;
    }
    .panel {
      border: 2px solid #000000;
      border-radius: 6px;
      background: #FFFFFF;
      display: flex;
      flex-direction: column;
      padding: 8px 10px;
      height: 100%;
    }
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #000000;
      padding-bottom: 4px;
      margin-bottom: 6px;
    }
    .panel-title {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .panel-tag {
      font-size: 11px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
      background: #0044CC;
      color: #FFFFFF;
    }

    /* AGENDA */
    .events-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
      overflow: hidden;
    }
    .event-card {
      border: 2px solid #000000;
      border-left: 6px solid #0044CC;
      border-radius: 4px;
      padding: 6px 8px;
      background: #FFFFFF;
      display: flex;
      flex-direction: column;
      gap: 2px;
      height: 74px;
      justify-content: center;
    }
    .event-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .event-time {
      font-size: 12px;
      font-weight: 800;
      color: #0044CC;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .event-duration {
      font-size: 9px;
      font-weight: 800;
      background: #000000;
      color: #FFFFFF;
      padding: 1px 4px;
      border-radius: 3px;
    }
    .event-title {
      font-size: 13px;
      font-weight: 800;
      color: #000000;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.15;
    }
    .event-attendees {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      font-weight: 700;
      color: #000000;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .attendees-names {
      color: #222222;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      text-align: center;
      gap: 6px;
      border: 2px dashed #000000;
      border-radius: 4px;
      padding: 12px;
    }
    .empty-state-title {
      font-size: 13px;
      font-weight: 800;
    }
    .empty-state-sub {
      font-size: 11px;
      font-weight: 600;
      color: #333333;
    }

    /* FINANZAS */
    .stocks-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      flex: 1;
    }
    .stock-card {
      border: 2px solid #000000;
      border-radius: 4px;
      padding: 5px 7px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 98px;
      background: #FFFFFF;
    }
    .stock-card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .stock-sym {
      font-size: 13px;
      font-weight: 800;
      color: #000000;
    }
    .badge-pill {
      font-size: 10px;
      font-weight: 800;
      padding: 1px 4px;
      border-radius: 3px;
      color: #FFFFFF;
      display: inline-flex;
      align-items: center;
      gap: 2px;
    }
    .badge-up { background-color: #008833; }
    .badge-down { background-color: #D60000; }
    .stock-val {
      font-size: 17px;
      font-weight: 800;
      color: #000000;
      margin: 1px 0;
    }
    .stock-desc {
      font-size: 10px;
      font-weight: 700;
      color: #000000;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      border-top: 1px solid #000000;
      padding-top: 2px;
    }

    .icon {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      display: inline-block;
      vertical-align: middle;
    }
    .icon-lg {
      width: 20px;
      height: 20px;
    }
  </style>
</head>
<body>

  <!-- CABECERA -->
  <div class="header">
    <!-- HORA Y FECHA -->
    <div class="header-time-box">
      <div class="clock-badge">
        <svg class="icon icon-lg" viewBox="0 0 24 24" style="stroke: #0044CC;"><circle cx="12" cy="12" r="9"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        <span id="header-time">--:--</span>
      </div>
      <div class="date-info">
        <div class="date-day" id="header-day">--</div>
        <div class="date-sub">Buenos Aires</div>
      </div>
    </div>

    <!-- PRONÓSTICO FIN DE SEMANA -->
    <div class="weekend-forecast-box">
      <div class="weekend-title">
        <svg class="icon" viewBox="0 0 24 24" style="stroke: #0044CC; width: 12px; height: 12px;"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line></svg>
        PRONÓSTICO FIN DE SEMANA
      </div>
      <div class="weekend-days">
        <div class="weekend-day-item"><span>SÁB:</span> <span id="sat-temp">--°/--°</span> <span id="sat-icon">⛅</span></div>
        <div class="weekend-day-item"><span>DOM:</span> <span id="sun-temp">--°/--°</span> <span id="sun-icon">☀️</span></div>
      </div>
    </div>

    <!-- CLIMA ACTUAL -->
    <div class="weather-current-box">
      <svg class="icon icon-lg" viewBox="0 0 24 24" style="stroke: #FFCC00; fill: #FFCC00;"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
      <div class="weather-temp" id="weather-temp">--°</div>
      <div class="weather-meta">
        <div class="weather-city">BUENOS AIRES</div>
        <div id="weather-desc">Cargando...</div>
        <div id="weather-range">Mín: --° | Máx: --°</div>
      </div>
    </div>
  </div>

  <!-- PANEL PRINCIPAL -->
  <div class="main-grid">
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">
          <svg class="icon" viewBox="0 0 24 24" style="stroke: #000000;"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
          PRÓXIMAS 8 HORAS
        </div>
        <div class="panel-tag" id="window-range">--:-- – --:--</div>
      </div>
      <div class="events-container" id="events-container"></div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">
          <svg class="icon" viewBox="0 0 24 24" style="stroke: #000000;"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>
          GOOGLE FINANCE
        </div>
        <div class="panel-tag" style="background: #000000;">CARTERA</div>
      </div>
      <div class="stocks-grid" id="stocks-grid"></div>
    </div>
  </div>

  <script>
    // 1. RELOJ Y FECHA
    function updateClock() {
      const now = new Date();
      const endWindow = new Date(now.getTime() + 8 * 60 * 60 * 1000);
      const pad = (n) => String(n).padStart(2, '0');
      const tStart = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
      const tEnd = `${pad(endWindow.getHours())}:${pad(endWindow.getMinutes())}`;

      document.getElementById('header-time').textContent = tStart;
      document.getElementById('window-range').textContent = `${tStart} – ${tEnd}`;
      document.getElementById('header-day').textContent = now.toLocaleDateString('es-AR', {
        weekday: 'long', day: 'numeric', month: 'long'
      });
    }

    // 2. CITAS REALES
    function renderEvents(events) {
      const container = document.getElementById('events-container');
      container.innerHTML = '';

      if (!events || events.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <svg class="icon icon-lg" viewBox="0 0 24 24" style="stroke: #008833;"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
            <div class="empty-state-title">Sin citas en las próximas 8 horas</div>
            <div class="empty-state-sub">Tu Google Calendar no registra compromisos en este período</div>
          </div>`;
        return;
      }

      events.slice(0, 4).forEach(evt => {
        const card = document.createElement('div');
        card.className = 'event-card';
        const attendeeText = evt.attendees && evt.attendees.length > 0
          ? evt.attendees.map(a => a.split('@')[0]).join(', ') : 'Sin invitados registrados';

        card.innerHTML = `
          <div class="event-top">
            <div class="event-time">
              <svg class="icon" viewBox="0 0 24 24" style="stroke: #0044CC;"><circle cx="12" cy="12" r="9"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
              <span>${evt.start} – ${evt.end}</span>
            </div>
            <span class="event-duration">${evt.duration || '30m'}</span>
          </div>
          <div class="event-title">${evt.title}</div>
          <div class="event-attendees">
            <svg class="icon" viewBox="0 0 24 24" style="stroke: #000000; min-width: 13px;"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle></svg>
            <span class="attendees-names">${attendeeText}</span>
          </div>`;
        container.appendChild(card);
      });
    }

    // 3. FINANZAS REALES
    function renderFinance(items) {
      const grid = document.getElementById('stocks-grid');
      grid.innerHTML = '';

      if (!items || items.length === 0) {
        grid.innerHTML = `
          <div class="empty-state" style="grid-column: span 2;">
            <div class="empty-state-title">Consultando cotizaciones...</div>
            <div class="empty-state-sub">Conectando con el servidor para leer tu hoja de cálculo</div>
          </div>`;
        return;
      }

      items.forEach(st => {
        const card = document.createElement('div');
        card.className = 'stock-card';
        const isUp = st.up;
        const badgeClass = isUp ? 'badge-up' : 'badge-down';
        const arrowSvg = isUp
          ? '<svg class="icon" style="width:10px;height:10px;stroke:#FFFFFF;" viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"></polyline></svg>'
          : '<svg class="icon" style="width:10px;height:10px;stroke:#FFFFFF;" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg>';

        card.innerHTML = `
          <div class="stock-card-top">
            <span class="stock-sym">${st.sym}</span>
            <span class="badge-pill ${badgeClass}">${arrowSvg} ${st.change}</span>
          </div>
          <div class="stock-val">$${st.price}</div>
          <div class="stock-desc">${st.name}</div>`;
        grid.appendChild(card);
      });
    }

    // 4. CLIMA OPEN-METEO
    async function fetchWeather() {
      try {
        const url = 'https://api.open-meteo.com/v1/forecast?latitude=-34.6037&longitude=-58.3816&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=America%2FArgentina%2FBuenos_Aires';
        const res = await fetch(url);
        const data = await res.json();

        document.getElementById('weather-temp').textContent = `${Math.round(data.current.temperature_2m)}°`;
        const code = data.current.weather_code;
        let desc = 'Despejado';
        if (code === 1 || code === 2) desc = 'Mayormente despejado';
        else if (code === 3) desc = 'Nublado';
        else if (code >= 51 && code <= 65) desc = 'Lluvia ligera';
        else if (code >= 80 && code <= 82) desc = 'Chaparrones';
        else if (code >= 95) desc = 'Tormenta';
        document.getElementById('weather-desc').textContent = desc;
        document.getElementById('weather-range').textContent = `Mín: ${Math.round(data.daily.temperature_2m_min[0])}° | Máx: ${Math.round(data.daily.temperature_2m_max[0])}°`;

        const times = data.daily.time;
        for (let i = 0; i < times.length; i++) {
          const day = new Date(times[i] + 'T12:00:00').getDay();
          if (day === 6) {
            document.getElementById('sat-temp').textContent = `${Math.round(data.daily.temperature_2m_min[i])}°/${Math.round(data.daily.temperature_2m_max[i])}°`;
          }
          if (day === 0) {
            document.getElementById('sun-temp').textContent = `${Math.round(data.daily.temperature_2m_min[i])}°/${Math.round(data.daily.temperature_2m_max[i])}°`;
          }
        }
      } catch (err) {}
    }

    // 5. CONSULTA AL SERVIDOR
    async function syncWithServer() {
      try {
        const resCal = await fetch('/api/calendar');
        if (resCal.ok) {
          const evts = await resCal.json();
          renderEvents(evts);
        } else {
          renderEvents([]);
        }
      } catch (e) {
        renderEvents([]);
      }

      try {
        const resFin = await fetch('/api/finance');
        if (resFin.ok) {
          const stocks = await resFin.json();
          if (stocks && stocks.length > 0) {
            renderFinance(stocks);
          }
        }
      } catch (e) {}
    }

    // INICIALIZACIÓN
    updateClock();
    renderEvents([]);
    renderFinance([]);
    fetchWeather();
    syncWithServer();

    setInterval(updateClock, 10000);
    setInterval(fetchWeather, 15 * 60 * 1000);
    setInterval(syncWithServer, 15 * 60 * 1000);
  </script>
</body>
</html>
