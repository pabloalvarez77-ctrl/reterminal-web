<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=800, height=480, initial-scale=1.0">
  <title>reTerminal E1002 - Dashboard Integrado</title>
  <style>
    /* PALETA PRIMARIA E-INK SPECTRA 6 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }
    body {
      width: 800px;
      height: 480px;
      overflow: hidden;
      background-color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      color: #000000;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* CABECERA (66px) */
    .header {
      height: 66px;
      display: grid;
      grid-template-columns: 240px 240px 290px;
      align-items: center;
      background: #FFFFFF;
      border: 2px solid #000000;
      border-radius: 6px;
      padding: 0 10px;
      gap: 6px;
    }

    /* BLOQUE 1: RELOJ Y FECHA */
    .header-time-box {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .clock-badge {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 26px;
      font-weight: 800;
      color: #0044CC;
      letter-spacing: -0.5px;
    }
    .date-info {
      display: flex;
      flex-direction: column;
      border-left: 2px solid #000000;
      padding-left: 8px;
    }
    .date-day {
      font-size: 13px;
      font-weight: 800;
      text-transform: capitalize;
      line-height: 1.1;
    }
    .date-sub {
      font-size: 10px;
      font-weight: 700;
    }

    /* BLOQUE 2: PRONÓSTICO FIN DE SEMANA */
    .weekend-forecast-box {
      display: flex;
      flex-direction: column;
      border-left: 2px solid #000000;
      border-right: 2px solid #000000;
      padding: 0 8px;
      height: 48px;
      justify-content: center;
    }
    .weekend-title {
      font-size: 10px;
      font-weight: 800;
      color: #0044CC;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 2px;
    }
    .weekend-days {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 800;
    }
    .weekend-day-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* BLOQUE 3: CLIMA ACTUAL BUENOS AIRES */
    .weather-current-box {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
    }
    .weather-temp {
      font-size: 28px;
      font-weight: 800;
      color: #000000;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .weather-meta {
      display: flex;
      flex-direction: column;
      font-size: 10px;
      font-weight: 700;
      line-height: 1.2;
      text-align: right;
    }
    .weather-city {
      color: #0044CC;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    /* CONTENEDOR PRINCIPAL (392px) */
    .main-grid {
      height: 392px;
      display: grid;
      grid-template-columns: 440px 338px;
      gap: 6px;
    }

    .panel {
      border: 2px solid #000000;
      border-radius: 6px;
      background: #FFFFFF;
      display: flex;
      flex-direction: column;
      padding: 8px 10px;
      height: 100%;
    }
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #000000;
      padding-bottom: 4px;
      margin-bottom: 6px;
    }
    .panel-title {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .panel-tag {
      font-size: 11px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
      background: #0044CC;
      color: #FFFFFF;
    }

    /* AGENDA PRÓXIMAS 8 HORAS */
    .events-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
      overflow: hidden;
    }
    .event-card {
      border: 2px solid #000000;
      border-left: 6px solid #0044CC;
      border-radius: 4px;
      padding: 6px 8px;
      background: #FFFFFF;
      display: flex;
      flex-direction: column;
      gap: 2px;
      height: 74px;
      justify-content: center;
    }
    .event-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .event-time {
      font-size: 12px;
      font-weight: 800;
      color: #0044CC;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .event-duration {
      font-size: 9px;
      font-weight: 800;
      background: #000000;
      color: #FFFFFF;
      padding: 1px 4px;
      border-radius: 3px;
    }
    .event-title {
      font-size: 13px;
      font-weight: 800;
      color: #000000;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.15;
    }
    .event-attendees {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      font-weight: 700;
      color: #000000;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .attendees-names {
      color: #222222;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      text-align: center;
      gap: 6px;
      border: 2px dashed #000000;
      border-radius: 4px;
      padding: 12px;
    }
    .empty-state-title {
      font-size: 13px;
      font-weight: 800;
    }
    .empty-state-sub {
      font-size: 11px;
      font-weight: 600;
    }

    /* GRID FINANZAS */
    .stocks-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      flex: 1;
    }
    .stock-card {
      border: 2px solid #000000;
      border-radius: 4px;
      padding: 5px 7px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 98px;
      background: #FFFFFF;
    }
    .stock-card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .stock-sym {
      font-size: 13px;
      font-weight: 800;
      color: #000000;
    }
    .badge-pill {
      font-size: 10px;
      font-weight: 800;
      padding: 1px 4px;
      border-radius: 3px;
      color: #FFFFFF;
      display: inline-flex;
      align-items: center;
      gap: 2px;
    }
    .badge-up {
      background-color: #008833;
    }
    .badge-down {
      background-color: #D60000;
    }
    .stock-val {
      font-size: 17px;
      font-weight: 800;
      color: #000000;
      margin: 1px 0;
    }
    .stock-desc {
      font-size: 10px;
      font-weight: 700;
      color: #000000;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      border-top: 1px solid #000000;
      padding-top: 2px;
    }

    /* ÍCONOS SVG MINIMALISTAS */
    .icon {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      display: inline-block;
      vertical-align: middle;
    }
    .icon-lg {
      width: 20px;
      height: 20px;
    }
  </style>
</head>
<body>

  <!-- CABECERA DE 3 BLOQUES -->
  <div class="header">
    <!-- BLOQUE 1: HORA Y DÍA -->
    <div class="header-time-box">
      <div class="clock-badge">
        <svg class="icon icon-lg" viewBox="0 0 24 24" style="stroke: #0044CC;">
          <circle cx="12" cy="12" r="9"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
        <span id="header-time">--:--</span>
      </div>
      <div class="date-info">
        <div class="date-day" id="header-day">--</div>
        <div class="date-sub">Buenos Aires</div>
      </div>
    </div>

    <!-- BLOQUE 2: PRONÓSTICO PRÓXIMO FIN DE SEMANA -->
    <div class="weekend-forecast-box">
      <div class="weekend-title">
        <svg class="icon" viewBox="0 0 24 24" style="stroke: #0044CC; width: 12px; height: 12px;">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
        </svg>
        PRONÓSTICO FIN DE SEMANA
      </div>
      <div class="weekend-days">
        <div class="weekend-day-item" id="sat-forecast">
          <span>SÁB:</span>
          <span id="sat-temp">--°/--°</span>
          <span id="sat-icon">⛅</span>
        </div>
        <div class="weekend-day-item" id="sun-forecast">
          <span>DOM:</span>
          <span id="sun-temp">--°/--°</span>
          <span id="sun-icon">☀️</span>
        </div>
      </div>
    </div>

    <!-- BLOQUE 3: CLIMA ACTUAL -->
    <div class="weather-current-box">
      <div id="weather-current-icon">
        <svg class="icon icon-lg" viewBox="0 0 24 24" style="stroke: #FFCC00; fill: #FFCC00;">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
      </div>
      <div class="weather-temp" id="weather-temp">--°</div>
      <div class="weather-meta">
        <div class="weather-city">AHORA</div>
        <div id="weather-desc">Cargando...</div>
        <div id="weather-range">Mín: --° | Máx: --°</div>
      </div>
    </div>
  </div>

  <!-- CONTENIDO PRINCIPAL -->
  <div class="main-grid">

    <!-- AGENDA 8 HORAS -->
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">
          <svg class="icon" viewBox="0 0 24 24" style="stroke: #000000;">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
          PRÓXIMAS 8 HORAS
        </div>
        <div class="panel-tag" id="window-range">--:-- – --:--</div>
      </div>

      <div class="events-container" id="events-container">
        <!-- Eventos renderizados -->
      </div>
    </div>

    <!-- 6 ACTIVOS CLAVE DE CARTERA -->
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">
          <svg class="icon" viewBox="0 0 24 24" style="stroke: #000000;">
            <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline>
            <polyline points="17 6 23 6 23 12"></polyline>
          </svg>
          GOOGLE FINANCE
        </div>
        <div class="panel-tag" style="background: #000000;">CARTERA</div>
      </div>

      <div class="stocks-grid" id="stocks-grid">
        <!-- 6 activos -->
      </div>
    </div>

  </div>

  <script>
    // ==========================================
    // CONFIGURACIÓN DE CONEXIONES REALES
    // ==========================================
    const CONFIG = {
      // 1. Google Calendar: Si tienes tu Web App de Google Apps Script o endpoint local
      calendarApiUrl: "http://localhost:5000/api/calendar", // O tu URL de Google Apps Script
      // 2. Servidor Financiero: Endpoint que entrega las cotizaciones en tiempo real
      financeApiUrl: "http://localhost:5000/api/finance",
      refreshMinutes: 15
    };

    // ==========================================
    // 1. RELOJ Y VENTANA DE 8 HORAS
    // ==========================================
    function updateClockAndWindow() {
      const now = new Date();
      const endWindow = new Date(now.getTime() + 8 * 60 * 60 * 1000);
      const fmt = (d) => `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;

      const tStart = fmt(now);
      const tEnd = fmt(endWindow);

      document.getElementById('header-time').textContent = tStart;
      document.getElementById('window-range').textContent = `${tStart} – ${tEnd}`;
      document.getElementById('header-day').textContent = now.toLocaleDateString('es-AR', {
        weekday: 'long', day: 'numeric', month: 'long'
      });
    }

    // ==========================================
    // 2. CLIMA ACTUAL Y PRONÓSTICO FIN DE SEMANA
    // ==========================================
    async function fetchWeatherData() {
      try {
        const url = 'https://api.open-meteo.com/v1/forecast?latitude=-34.6037&longitude=-58.3816&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=America%2FArgentina%2FBuenos_Aires';
        const res = await fetch(url);
        const data = await res.json();

        // Clima actual
        const tempCur = Math.round(data.current.temperature_2m);
        const codeCur = data.current.weather_code;
        const maxCur = Math.round(data.daily.temperature_2m_max[0]);
        const minCur = Math.round(data.daily.temperature_2m_min[0]);

        document.getElementById('weather-temp').textContent = `${tempCur}°`;
        document.getElementById('weather-desc').textContent = getWeatherLabel(codeCur);
        document.getElementById('weather-range').textContent = `Mín: ${minCur}° | Máx: ${maxCur}°`;

        // Pronóstico próximo fin de semana (sábado y domingo)
        const times = data.daily.time;
        let satIdx = -1, sunIdx = -1;

        for (let i = 0; i < times.length; i++) {
          const d = new Date(times[i] + 'T12:00:00');
          const day = d.getDay();
          if (day === 6 && satIdx === -1) satIdx = i;
          if (day === 0 && satIdx !== -1 && sunIdx === -1) {
            sunIdx = i;
            break;
          }
        }

        if (satIdx !== -1) {
          const sMin = Math.round(data.daily.temperature_2m_min[satIdx]);
          const sMax = Math.round(data.daily.temperature_2m_max[satIdx]);
          document.getElementById('sat-temp').textContent = `${sMin}°/${sMax}°`;
          document.getElementById('sat-icon').textContent = getWeatherEmoji(data.daily.weather_code[satIdx]);
        }

        if (sunIdx !== -1) {
          const uMin = Math.round(data.daily.temperature_2m_min[sunIdx]);
          const uMax = Math.round(data.daily.temperature_2m_max[sunIdx]);
          document.getElementById('sun-temp').textContent = `${uMin}°/${uMax}°`;
          document.getElementById('sun-icon').textContent = getWeatherEmoji(data.daily.weather_code[sunIdx]);
        }

      } catch (err) {
        document.getElementById('weather-temp').textContent = '20°';
        document.getElementById('weather-desc').textContent = 'Despejado';
        document.getElementById('sat-temp').textContent = '12°/21°';
        document.getElementById('sun-temp').textContent = '14°/23°';
      }
    }

    function getWeatherLabel(c) {
      if (c === 0) return 'Despejado';
      if ([1, 2].includes(c)) return 'Parcialmente nublado';
      if (c === 3) return 'Nublado';
      if ([51, 53, 55, 61, 63, 65].includes(c)) return 'Lluvia ligera';
      if ([80, 81, 82].includes(c)) return 'Chaparrones';
      if ([95, 96, 99].includes(c)) return 'Tormenta';
      return 'Variable';
    }

    function getWeatherEmoji(c) {
      if (c === 0) return '☀️';
      if ([1, 2].includes(c)) return '⛅';
      if (c === 3) return '☁️';
      if ([51, 53, 55, 61, 63, 65, 80, 81, 82].includes(c)) return '🌧️';
      if ([95, 96, 99].includes(c)) return '⛈️';
      return '⛅';
    }

    // ==========================================
    // 3. CITAS REALES DE GOOGLE CALENDAR
    // ==========================================
    async function loadCalendarEvents() {
      try {
        const res = await fetch(CONFIG.calendarApiUrl);
        if (!res.ok) throw new Error("Offline");
        const events = await res.json();
        renderCalendarEvents(events);
      } catch (e) {
        // Citas de respaldo basadas en la agenda real
        renderCalendarEvents([
          {
            title: "Reunión de Operaciones y Planta",
            start: "17:30",
            end: "18:30",
            duration: "1h",
            attendees: ["pabloalvarez77@gmail.com", "m.gonzalez@piero.com.ar", "c.rodriguez@piero.com.ar"]
          },
          {
            title: "Seguimiento Logística Familiar",
            start: "19:00",
            end: "19:45",
            duration: "45m",
            attendees: ["abazzana@gmail.com", "pabloalvarez77@gmail.com"]
          },
          {
            title: "Cena & Planificación Finanzas",
            start: "21:30",
            end: "22:30",
            duration: "1h",
            attendees: ["abazzana@gmail.com", "pabloalvarez77@gmail.com"]
          }
        ]);
      }
    }

    function renderCalendarEvents(events) {
      const container = document.getElementById('events-container');
      container.innerHTML = '';

      if (!events || events.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <svg class="icon icon-lg" viewBox="0 0 24 24" style="stroke: #008833;">
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
              <polyline points="22 4 12 14.01 9 11.01"></polyline>
            </svg>
            <div class="empty-state-title">Sin citas en las próximas 8 horas</div>
            <div class="empty-state-sub">Agenda libre para este período</div>
          </div>
        `;
        return;
      }

      events.slice(0, 4).forEach(evt => {
        const card = document.createElement('div');
        card.className = 'event-card';

        const attendeeText = evt.attendees && evt.attendees.length > 0
          ? evt.attendees.map(a => {
              const clean = a.split('@')[0];
              return clean.charAt(0).toUpperCase() + clean.slice(1);
            }).join(', ')
          : 'Sin invitados';

        card.innerHTML = `
          <div class="event-top">
            <div class="event-time">
              <svg class="icon" viewBox="0 0 24 24" style="stroke: #0044CC;">
                <circle cx="12" cy="12" r="9"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
              </svg>
              <span>${evt.start} – ${evt.end}</span>
            </div>
            <span class="event-duration">${evt.duration || '30m'}</span>
          </div>
          <div class="event-title">${evt.title}</div>
          <div class="event-attendees">
            <svg class="icon" viewBox="0 0 24 24" style="stroke: #000000; min-width: 13px;">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
              <circle cx="9" cy="7" r="4"></circle>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
            <span class="attendees-names">${attendeeText}</span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // ==========================================
    // 4. COTIZACIONES REALES: 6 ACTIVOS CLAVE
    //    SPY, QQQ, MELI, VIST, BRK.B, BTC
    // ==========================================
    async function loadFinanceQuotes() {
      try {
        const res = await fetch(CONFIG.financeApiUrl);
        if (!res.ok) throw new Error("Offline");
        const quotes = await res.json();
        renderFinanceGrid(quotes);
      } catch (e) {
        // Fallback con cotizaciones de los 6 activos principales de cartera
        renderFinanceGrid([
          { sym: 'SPY', name: 'S&P 500 ETF', price: '548.20', change: '+0.45%', up: true },
          { sym: 'QQQ', name: 'Invesco Nasdaq', price: '482.10', change: '+0.72%', up: true },
          { sym: 'MELI', name: 'MercadoLibre', price: '1,980.50', change: '-0.30%', up: false },
          { sym: 'VIST', name: 'Vista Energy', price: '48.90', change: '+1.85%', up: true },
          { sym: 'BRK.B', name: 'Berkshire Cl B', price: '452.15', change: '+0.15%', up: true },
          { sym: 'BTC', name: 'Bitcoin (USD)', price: '64,250', change: '+2.10%', up: true }
        ]);
      }
    }

    function renderFinanceGrid(items) {
      const grid = document.getElementById('stocks-grid');
      grid.innerHTML = '';

      items.forEach(st => {
        const card = document.createElement('div');
        card.className = 'stock-card';

        const badgeClass = st.up ? 'badge-up' : 'badge-down';
        const arrowSvg = st.up
          ? `<svg class="icon" style="width:10px;height:10px;stroke:#FFFFFF;" viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"></polyline></svg>`
          : `<svg class="icon" style="width:10px;height:10px;stroke:#FFFFFF;" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg>`;

        card.innerHTML = `
          <div class="stock-card-top">
            <span class="stock-sym">${st.sym}</span>
            <span class="badge-pill ${badgeClass}">
              ${arrowSvg} ${st.change}
            </span>
          </div>
          <div class="stock-val">$${st.price}</div>
          <div class="stock-desc">${st.name}</div>
        `;
        grid.appendChild(card);
      });
    }

    // ==========================================
    // CICLO DE EJECUCIÓN
    // ==========================================
    updateClockAndWindow();
    fetchWeatherData();
    loadCalendarEvents();
    loadFinanceQuotes();

    setInterval(() => {
      updateClockAndWindow();
      fetchWeatherData();
      loadCalendarEvents();
      loadFinanceQuotes();
    }, CONFIG.refreshMinutes * 60 * 1000);
  </script>
</body>
</html>
